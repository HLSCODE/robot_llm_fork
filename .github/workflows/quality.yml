name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            extras: >-
              --extra gui --extra server --extra ai --extra data
              --extra vision --extra hardware
          - name: Linux
            os: ubuntu-latest
            extras: >-
              --extra gui --extra server --extra ai --extra data
              --extra vision
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            xauth \
            xvfb

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --group dev ${{ matrix.extras }}

      - name: Run quality gates on Windows
        if: runner.os != 'Linux'
        run: >-
          uv run --frozen --group dev ${{ matrix.extras }}
          python scripts/run_quality_checks.py

      - name: Run quality gates on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: >-
          xvfb-run --auto-servernum
          uv run --frozen --group dev ${{ matrix.extras }}
          python scripts/run_quality_checks.py

  optional-extra:
    name: Optional ${{ matrix.extra }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [Windows, Linux]
        extra: [gui, server, hardware]
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux' && matrix.extra == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            xauth \
            xvfb

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install isolated optional dependency group
        run: uv sync --frozen --no-dev --extra ${{ matrix.extra }}

      - name: Smoke-test optional dependency group
        if: runner.os != 'Linux' || matrix.extra != 'gui'
        run: >-
          uv run --frozen --no-dev --extra ${{ matrix.extra }}
          python scripts/validate_optional_extra.py ${{ matrix.extra }}

      - name: Smoke-test Linux GUI dependency group
        if: runner.os == 'Linux' && matrix.extra == 'gui'
        env:
          QT_QPA_PLATFORM: xcb
        run: >-
          xvfb-run --auto-servernum
          uv run --frozen --no-dev --extra gui
          python scripts/validate_optional_extra.py gui
