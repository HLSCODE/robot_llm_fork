name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build and smoke-test Windows portable bundle
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: robot-llm-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
