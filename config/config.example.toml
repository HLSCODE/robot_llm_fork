# 用途：应用配置总入口，声明要加载的子配置，也可集中编写全部配置。
# 使用：复制为 config/config.toml；子配置不会自动加载，必须在 include 中引用。
# 查找：各示例文件的职责和选择建议见 config/README.md。
#
# 本文件是唯一配置入口。include 按声明顺序加载子配置，本文件中声明的
# 同名字段覆盖所有子配置；.env 和系统环境变量拥有最高优先级。
# 如需使用单文件配置，可删除 include 并将所有配置表直接写入本文件。
# API Key、认证 Token 等敏感值只能配置在 .env 或系统环境变量中。

schema_version = 6

include = [
  "fragments/application.toml",
  "fragments/services.toml",
  "fragments/server.toml",
  "fragments/ai.toml",
  "fragments/robot.toml",
  "fragments/robots/realman.toml",
  "fragments/robots/tianji.toml",
  "fragments/mobile-base.toml",
  "fragments/devices.toml",
  "fragments/end-effectors.toml",
  "fragments/end-effectors/connections.toml",
  "fragments/end-effectors/robot.toml",
  "fragments/end-effectors/zhixing.toml",
  "fragments/end-effectors/adp.toml",
  "fragments/end-effectors/kuaihuanshou.toml",
  "fragments/end-effectors/dh-rgd.toml",
  "fragments/voice.toml",
]
