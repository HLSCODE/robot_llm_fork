[project]
name = "robot-llm"
version = "0.1.0"
description = "机器人操作编排系统，集成 AI 自然语言任务规划"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
    "numpy>=1.26",
]
server = [
    "numpy>=1.26",
    "websockets>=12.0",
]
ai = [
    "openai>=1.0.0",
]
data = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.10,<5",
]
vision = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.10,<5",
    "ultralytics>=8.4.36",
    "scikit-learn>=1.8.0",
]
hardware = [
    "numpy>=1.26",
    "pyserial>=3.5",
    "robotic-arm>=1.1.5",
    "pyrealsense2>=2.57.7.10387",
]
voice = [
    "funasr>=1.2.0",
    "llvmlite>=0.44.0",
    "numpy>=1.26",
    "numba>=0.61.0",
    "pypinyin>=0.50",
    "sherpa-onnx-core>=1.13.4",
    "sounddevice>=0.5",
    "torch>=2.3",
    "torchaudio>=2.11.0",
]
kws = [
    "sherpa-onnx>=1.10.0",
]
openwakeword = []
full = [
    "PySide6>=6.6.0",
    "funasr>=1.2.0",
    "llvmlite>=0.44.0",
    "numba>=0.61.0",
    "numpy>=1.26",
    "openai>=1.0.0",
    "opencv-python>=4.10,<5",
    "pypinyin>=0.50",
    "pyrealsense2>=2.57.7.10387",
    "pyserial>=3.5",
    "robotic-arm>=1.1.5",
    "scikit-learn>=1.8.0",
    "scipy>=1.11",
    "sherpa-onnx>=1.10.0",
    "sherpa-onnx-core>=1.13.4",
    "sounddevice>=0.5",
    "torch>=2.3",
    "torchaudio>=2.11.0",
    "ultralytics>=8.4.36",
    "websockets>=12.0",
]

[project.scripts]
robot-llm = "src.bootstrap.launcher:main"
t5l-dgus = "src.devices.displays.t5l_dgusii.cli:main"
robot-data-validate = "src.data_collection.validation:main"
robot-llm-regression = "src.llm.regression:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 50
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "scripts/run_performance_benchmarks.py",
    "scripts/run_quality_checks.py",
    "scripts/validate_optional_extra.py",
    "scripts/validate_package.py",
    "src/execution/workflows/**/*.py",
    "src/application/**/*.py",
    "src/bootstrap/**/*.py",
    "src/configuration/**/*.py",
    "src/domain/**/*.py",
    "src/geometry/**/*.py",
    "src/observability/**/*.py",
    "src/persistence/**/*.py",
    "src/data_collection/**/*.py",
    "src/devices/**/*.py",
    "src/execution/**/*.py",
    "src/gui/**/*.py",
    "src/llm/**/*.py",
    "src/robot_server/**/*.py",
    "src/skill_system/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.mypy]
python_version = "3.12"
files = [
    "scripts/run_performance_benchmarks.py",
    "src/execution",
    "src/configuration/settings.py",
    "src/persistence/json_documents.py",
    "src/observability/logging_config.py",
    "src/configuration/data_paths.py",
    "src/configuration/config_validation.py",
    "src/persistence/storage.py",
    "src/persistence/vision_station_storage.py",
    "src/application/builtin_data.py",
    "src/application/balance.py",
    "src/application/task_composer.py",
    "src/application/composition.py",
    "src/application/factory.py",
    "src/application/services.py",
    "src/application/teleoperation.py",
    "src/application/teleoperation_observability.py",
    "src/application/workflow_compiler.py",
    "src/application/workflow_preflight.py",
    "src/application/workflow_validation.py",
    "src/domain/workflow.py",
    "src/robot_server/protocol/messages.py",
    "src/robot_server/protocol/routing.py",
    "src/robot_server/security/request_limits.py",
    "src/llm/types.py",
    "src/llm/fingerprints.py",
    "src/llm/metrics.py",
    "src/llm/routing.py",
    "src/llm/registry.py",
    "src/devices/runtime/arm_models.py",
    "src/devices/runtime/errors.py",
    "src/devices/runtime/models.py",
    "src/devices/runtime/sensor_models.py",
    "src/devices/sensors/balance/provider.py",
    "src/devices/robots/provider.py",
    "src/devices/robots/registry.py",
    "src/devices/robots/realman/adapter.py",
    "src/devices/robots/realman/provider.py",
    "src/application/external_localization.py",
    "src/localization/models.py",
    "src/localization/provider.py",
    "src/localization/udp.py",
    "src/gui/controllers/startup.py",
    "src/gui/bridges/execution.py",
    "src/gui/bridges/notifications.py",
    "src/gui/view_models/models.py",
    "src/gui/views/workflow.py",
    "src/gui/views/workflow_canvas",
    "src/vision/models.py",
    "src/vision/metrics.py",
    "src/vision/artifacts.py",
    "src/vision/service.py",
    "src/vision/simulation.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
